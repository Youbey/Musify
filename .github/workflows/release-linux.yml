name: Release (Linux)

# Builds an unofficial Linux desktop bundle for this fork.
# Not part of the upstream Android release flow. Trigger by pushing a
# desktop-v* tag or from the Actions tab (Run workflow).

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libfuse2 librsvg2-common \
            file wget xz-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter --version
          flutter pub get

      - name: Build release
        run: flutter build linux --release

      - name: Package tarball
        run: |
          set -euo pipefail
          cd build/linux/x64/release
          mv bundle musify
          cp "$GITHUB_WORKSPACE/packaging/linux/README.txt" musify/README.txt
          tar czf "$GITHUB_WORKSPACE/Musify-linux-x64.tar.gz" musify
          cd "$GITHUB_WORKSPACE"
          ls -lh Musify-linux-x64.tar.gz

      - name: Build AppImage (best effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          export DEPLOY_GTK_VERSION=3
          export PATH="$PWD:$PATH"

          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/192x192/apps
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          install -m 0644 packaging/linux/musify.png AppDir/musify.png
          install -m 0644 packaging/linux/musify.png \
            AppDir/usr/share/icons/hicolor/192x192/apps/musify.png
          install -m 0644 packaging/linux/musify.desktop \
            AppDir/usr/share/applications/musify.desktop
          install -m 0644 packaging/linux/musify.desktop AppDir/musify.desktop

          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh

          MPV="$(ldconfig -p | awk '/libmpv\.so/{print $NF; exit}')"
          LIBARGS=""
          if [ -n "${MPV:-}" ]; then LIBARGS="--library $MPV"; fi

          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/musify.desktop \
            --icon-file AppDir/musify.png \
            $LIBARGS \
            --plugin gtk \
            --output appimage

          for f in ./*.AppImage; do mv "$f" Musify-linux-x64.AppImage; done
          ls -lh Musify-linux-x64.AppImage

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum Musify-linux-x64.tar.gz > SHA256SUMS.txt
          if [ -f Musify-linux-x64.AppImage ]; then
            sha256sum Musify-linux-x64.AppImage >> SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Determine release tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            V="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
            TAG="desktop-v${V}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing as $TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          FILES="Musify-linux-x64.tar.gz SHA256SUMS.txt"
          if [ -f Musify-linux-x64.AppImage ]; then
            FILES="$FILES Musify-linux-x64.AppImage"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "Musify for Linux $TAG" \
              --notes-file packaging/linux/RELEASE_NOTES.md \
              --latest
          fi
